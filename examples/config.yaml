# Example Hermes config.yaml for proxy-relay integration
#
# The plugin creates entries like <name>-proxied automatically.
# This example shows what a typical result looks like after:
#   /relay setup clone 1  (cloning 'spacetimellm')

custom_providers:
- name: spacetimellm
  base_url: http://localhost:4000/v1
  api_key: sk-...
  model: auto

# ── Created by the plugin — routes through the relay ────────────
- name: spacetimellm-proxied
  base_url: http://localhost:4002/v1
  api_key: relay-key
  model: auto

model:
  default: auto
  provider: custom:spacetimellm-proxied

# ── Relay reads from ~/.hermes/proxy-relay/config.json ──────────
# {
#   "UPSTREAM_BASE": "http://localhost:4000/v1",
#   "UPSTREAM_API_KEY": "sk-...",
#   "UPSTREAM_AUTH_TYPE": "bearer"
# }
