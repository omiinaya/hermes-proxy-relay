# Example Hermes config.yaml for proxy-relay integration

custom_providers:
- name: proxy-relay
  base_url: http://localhost:4002/v1
  api_key: relay-key
  model: default
  models:
    default:
      context_length: 131072
    deepseek-v4-flash-free:
      context_length: 1048576
    mimo-v2.5-free:
      context_length: 131072

model:
  default: auto
  provider: custom:proxy-relay

# ── .env required vars ────────────────────────────────────────────
# UPSTREAM_BASE=https://api.opencode-zen.com/v1
# UPSTREAM_API_KEY=public
# UPSTREAM_AUTH_TYPE=x-api-key
# PROXY_LIST=/home/user/proxies.txt
# RELAY_PORT=4002
# MAX_CONCURRENT_UPSTREAM=10
# MODEL_FILTER_PATTERN=-free$
