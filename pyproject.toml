[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hermes-proxy-relay"
version = "1.4.1"
description = "SOCKS5 proxy rotation relay for Hermes Agent — clone any custom_providers entry with proxy routing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "omiinaya", email = "omiinaya@gmail.com"},
]
keywords = ["hermes", "proxy", "relay", "socks5", "llm"]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx[socks]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
hermes-proxy-relay = "relay.relay:main"

[tool.setuptools.packages.find]
include = ["relay*", "plugin*", "mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W"]
ignore = ["E501", "F841"]

[tool.ruff.lint.per-file-ignores]
"plugin/**" = ["F"]
"mcp/**" = ["F"]
